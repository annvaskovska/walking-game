<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Your city starts in fog. Every street you walk lights up, with its houses and its name, for good." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mr Sparkles" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- The start screen's type, shipped with the app (OFL, see public/fonts/). Some
         accented letters come from the latin-ext files, loaded only when a name needs them. -->
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Mr Sparkles</title>
    <script>
      // Runs before the first paint: picks the screen to show and starts downloading the map tile
      // you were last in, so it is here before the app is. Keep in step with src/data/tileUrl.ts.
      (function () {
        var h = document.documentElement;
        function get(k) {
          try { return localStorage.getItem(k); } catch (e) { return null; }
        }
        function json(k) {
          try { return JSON.parse(get(k) || 'null'); } catch (e) { return null; }
        }
        var sim = /[?&]sim(=|&|$)/.test(location.search);
        // The demo walk keeps its own records, apart from your real ones.
        var sfx = sim ? '-sim' : '';
        window.__wl = { sim: sim, sfx: sfx, tapped: 0, fix: null, err: null, app: null };
        // The map's worker comes down alongside the app instead of after it (see vite.config.ts).
        var wk = '%WL_WORKER%';
        if (wk) fetch(wk).then(function (r) { return r.arrayBuffer(); }).catch(function () {});
        if (get('wl-walking' + sfx)) h.classList.add('wl-walking');
        var pos = json('wl-pos' + sfx);
        if (!pos || !isFinite(pos.lon) || !isFinite(pos.lat)) return;
        h.classList.add('wl-has-map');
        var t = get('wl-tiles');
        if (!t || !/^https:\/\/tiles\.openfreemap\.org\/[\w./-]+\/\{z\}\/\{x\}\/\{y\}\.pbf$/.test(t)) t = '%WL_TILES%';
        var z = 14, n = 1 << z, lat = (pos.lat * Math.PI) / 180;
        var fx = ((pos.lon + 180) / 360) * n, fy = ((1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2) * n;
        var x = Math.floor(fx), y = Math.floor(fy), edge = 250 / ((40075016.686 * Math.cos(lat)) / n);
        var pre = (window.__wlPrefetch = {});
        for (var dx = -1; dx <= 1; dx++) {
          for (var dy = -1; dy <= 1; dy++) {
            if ((dx < 0 && fx - x > edge) || (dx > 0 && x + 1 - fx > edge)) continue;
            if ((dy < 0 && fy - y > edge) || (dy > 0 && y + 1 - fy > edge)) continue;
            var key = z + '/' + (x + dx) + '/' + (y + dy);
            pre[key] = fetch(t.replace('{z}', z).replace('{x}', x + dx).replace('{y}', y + dy), { credentials: 'omit' })
              .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.arrayBuffer();
              });
            pre[key].catch(function () {});
          }
        }
      })();
    </script>
    <style>
      /* Instrument Serif, slim and sharp, set large for the name and the numbers; Instrument Sans
         for everything else. The map's labels use the same files (src/map/style.ts). The serif
         waits for its file rather than flashing in a stand-in; the sans swaps in. */
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(/fonts/instrument-serif-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(/fonts/instrument-serif-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url(/fonts/instrument-serif-italic-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url(/fonts/instrument-serif-italic-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/instrument-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/instrument-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        --bg: #0b0d12;
        --ink: #f4ead8;
        --text: #c3cad8;
        --muted: #8a94a8;
        --faint: #5f687b;
        --gold: #f0c987;
        --amber: #ffb46b;
        --serif: 'Instrument Serif', ui-serif, 'New York', Georgia, serif;
        --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --top: env(safe-area-inset-top, 0px);
        --bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        /* The serif has one weight: never fake a bold one. */
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      a { color: inherit; }

      /* The map, and the bits of MapLibre's stylesheet it needs (the rest is never loaded). */
      .wl-map { position: fixed; inset: 0; background: var(--bg); }
      .maplibregl-map { overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      .maplibregl-canvas { position: absolute; left: 0; top: 0; outline: none; }
      .maplibregl-canvas-container.maplibregl-touch-zoom-rotate,
      .maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas { touch-action: pan-x pan-y; }
      .maplibregl-canvas-container.maplibregl-touch-drag-pan,
      .maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: pinch-zoom; }
      .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,
      .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }

      /* ---- Start screen ---- */
      .wl-splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
        padding: calc(var(--top) + 24px) 24px calc(var(--bottom) + 22px);
        transition: opacity 0.5s ease, visibility 0s linear 0.5s;
      }
      /* No map yet: a solid night with a warm glow, faded out once the map is drawn behind. */
      .wl-splash::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(90% 55% at 50% 30%, rgba(255, 180, 107, 0.09), transparent 70%), var(--bg);
        transition: opacity 0.9s ease;
      }
      .wl-has-map .wl-splash::before { opacity: 0; }
      .wl-walking .wl-splash { opacity: 0; visibility: hidden; pointer-events: none; }
      .wl-card {
        position: relative;
        margin-top: auto;
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        text-wrap: pretty;
      }
      /* Over the map, the card sits on night that fades up into it: your streets show above. */
      .wl-card::before {
        content: '';
        position: absolute;
        z-index: -1;
        left: 50%;
        width: 100vw;
        top: -110px;
        bottom: calc(-1 * (var(--bottom) + 22px));
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(11, 13, 18, 0) 0, rgba(11, 13, 18, 0.8) 70px, var(--bg) 118px);
        transition: opacity 0.9s ease;
      }
      /* First open, nothing behind yet: the name in the middle of the night, Start at the bottom. */
      html:not(.wl-has-map) .wl-card::before { opacity: 0; }
      html:not(.wl-has-map) .wl-card:not(.wl-summary) { flex: 1 0 auto; margin-top: 0; }
      html:not(.wl-has-map) .wl-card:not(.wl-summary) .wl-head { margin-block: auto; }
      .wl-head { display: flex; flex-direction: column; align-items: center; }
      .wl-logo { width: 104px; height: 104px; }
      .wl-title { margin: 10px 0 0; font: 400 64px/0.95 var(--serif); letter-spacing: -0.02em; color: var(--ink); }
      .wl-title i { color: var(--gold); }
      .wl-lead { margin: 16px 0 0; max-width: 270px; font-size: 16px; line-height: 1.5; color: var(--muted); }

      /* After a walk: the distance, large, and what it added to your map. */
      .wl-sum { display: none; width: 100%; flex-direction: column; align-items: center; }
      .wl-summary .wl-head, .wl-summary .wl-stats { display: none; }
      .wl-summary .wl-sum { display: flex; }
      .wl-hero { margin: 0; font: 400 104px/0.9 var(--serif); letter-spacing: -0.015em; color: var(--ink); white-space: nowrap; }
      .wl-hero i { margin-left: 8px; font-size: 44px; letter-spacing: 0; color: var(--gold); }
      .wl-sub { margin: 10px 0 0; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .wl-rule { width: 100%; height: 1px; margin-top: 20px; background: rgba(201, 211, 230, 0.1); }
      .wl-label { margin: 18px 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
      .wl-names { margin: 6px 0 0; font: italic 400 32px/1.15 var(--serif); color: var(--gold); }
      .wl-names[data-long] { font-size: 26px; }
      .wl-more { margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
      .wl-sum[data-empty] .wl-more { margin-top: 18px; }

      .wl-stats { margin: 22px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .wl-stats b { color: var(--text); font-weight: 600; }
      .wl-msg { margin: 20px 0 0; padding: 12px 14px; width: 100%; border-radius: 14px; background: rgba(255, 140, 90, 0.08); border: 1px solid rgba(255, 150, 100, 0.22); font-size: 14px; line-height: 1.45; text-align: left; color: #f1d6c4; }
      .wl-msg b { color: var(--ink); font-weight: 600; }
      .wl-go {
        position: relative;
        margin-top: 26px;
        width: 100%;
        height: 58px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffdca3 0%, #f4b164 100%);
        color: #21160a;
        font-size: 17px;
        font-weight: 600;
        box-shadow: 0 14px 34px -12px rgba(255, 170, 90, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.55);
        transition: transform 0.12s ease, filter 0.2s ease;
      }
      .wl-summary .wl-go { margin-top: 24px; }
      .wl-go:active { transform: scale(0.985); filter: brightness(0.96); }
      .wl-go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .wl-go[aria-busy='true'] { color: transparent; }
      .wl-go[aria-busy='true']::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        border-radius: 50%;
        border: 2.5px solid rgba(33, 22, 10, 0.25);
        border-top-color: #21160a;
        animation: wl-spin 0.8s linear infinite;
      }
      @keyframes wl-spin { to { transform: rotate(360deg); } }
      /* One line: what happens to your location, or, wherever the map shows, whose map it is. */
      .wl-fine { margin: 14px 0 0; font-size: 12px; line-height: 1.5; color: var(--faint); }
      .wl-fine a { text-decoration: none; white-space: nowrap; }
      .wl-fine a:hover { text-decoration: underline; }
      .wl-fine__credit, .wl-has-map .wl-fine__privacy { display: none; }
      .wl-has-map .wl-fine__credit { display: inline; }
      @media (max-height: 660px) {
        .wl-logo { width: 80px; height: 80px; }
        .wl-title { font-size: 54px; }
        .wl-hero { font-size: 88px; }
        .wl-hero i { font-size: 38px; }
        .wl-go { margin-top: 20px; }
      }
      /* A phone on its side: the essentials, with Start in view and no scrolling. */
      @media (max-height: 500px) {
        .wl-splash { padding-top: calc(var(--top) + 12px); padding-bottom: calc(var(--bottom) + 12px); }
        .wl-card::before { bottom: calc(-1 * (var(--bottom) + 12px)); }
        .wl-logo { display: none; }
        .wl-title { font-size: 44px; }
        .wl-lead { margin-top: 10px; }
        .wl-hero { font-size: 64px; }
        .wl-hero i { font-size: 30px; }
        .wl-rule { margin-top: 12px; }
        .wl-label { margin-top: 10px; }
        .wl-names, .wl-names[data-long] { font-size: 24px; }
        .wl-stats { margin-top: 14px; }
        .wl-go, .wl-summary .wl-go { margin-top: 16px; height: 52px; }
        .wl-fine { margin-top: 10px; }
      }

      /* ---- Walk view: only the map. A tap shows this, for a few seconds. ---- */
      .wl-hud {
        position: fixed;
        left: 50%;
        bottom: calc(var(--bottom) + 28px);
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 6px 6px 6px 16px;
        border-radius: 999px;
        background: rgba(14, 17, 24, 0.86);
        border: 1px solid rgba(201, 211, 230, 0.1);
        box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.7);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        white-space: nowrap;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        transform: translate(-50%, 0);
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0s;
      }
      .wl-hud[hidden] { display: flex; opacity: 0; visibility: hidden; transform: translate(-50%, 16px); transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s; }
      .wl-hud__dot { width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(255, 180, 107, 0.16); }
      .wl-hud__sep { width: 1px; height: 14px; margin: 0 10px; background: rgba(201, 211, 230, 0.16); }
      .wl-hud__end {
        margin-left: 12px;
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .wl-hud__end[data-armed] { background: var(--amber); color: #21160a; }
      .wl-credit {
        position: fixed;
        left: 50%;
        bottom: calc(var(--bottom) + 7px);
        z-index: 4;
        margin: 0;
        white-space: nowrap;
        transform: translateX(-50%);
        font-size: 10px;
        line-height: 1.3;
        color: rgba(201, 211, 230, 0.55);
        transition: opacity 0.4s ease, visibility 0s linear 0s;
      }
      .wl-credit a { text-decoration: none; }
      .wl-credit[hidden] { display: block; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0s linear 0.4s; }
      .wl-toast {
        position: fixed;
        left: 50%;
        top: calc(var(--top) + 14px);
        z-index: 6;
        max-width: min(92vw, 420px);
        padding: 10px 16px;
        border-radius: 14px;
        background: rgba(14, 17, 24, 0.9);
        border: 1px solid rgba(201, 211, 230, 0.1);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        font-size: 14px;
        line-height: 1.4;
        text-align: center;
        color: var(--ink);
        transform: translate(-50%, 0);
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0s;
      }
      .wl-toast[hidden] { display: block; opacity: 0; visibility: hidden; transform: translate(-50%, -12px); transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s; }
      .wl-toast[data-kind='warn'] { border-color: rgba(255, 170, 110, 0.35); }
      @media (prefers-reduced-motion: reduce) {
        .wl-splash, .wl-splash::before, .wl-hud, .wl-toast, .wl-credit { transition: none; }
      }
      .wl-fatal { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; background: var(--bg); }
      .wl-fatal h2 { margin: 0; font: 400 34px/1.1 var(--serif); color: var(--ink); }
      .wl-fatal button { justify-self: center; height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--amber); color: #21160a; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="map" class="wl-map"></div>

    <main id="splash" class="wl-splash">
      <div class="wl-card">
        <div class="wl-head">
          <svg class="wl-logo" viewBox="0 0 96 96" aria-hidden="true">
            <defs>
              <radialGradient id="wl-glow" cx="41" cy="57" r="38" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffc98a" stop-opacity="0.45" />
                <stop offset="0.45" stop-color="#ffc98a" stop-opacity="0.12" />
                <stop offset="1" stop-color="#ffc98a" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="wl-cone" x1="41" y1="57" x2="50" y2="12" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffe3b8" stop-opacity="0.6" />
                <stop offset="1" stop-color="#ffe3b8" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="wl-lit" x1="30" y1="92" x2="56" y2="6" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#f0c987" />
                <stop offset="0.45" stop-color="#ffd9a0" />
                <stop offset="1" stop-color="#f0c987" stop-opacity="0.15" />
              </linearGradient>
            </defs>
            <circle cx="41" cy="57" r="38" fill="url(#wl-glow)" />
            <path d="M6 70 90 38" stroke="#2b3242" stroke-width="5" stroke-linecap="round" />
            <path d="M30 92 56 6" stroke="url(#wl-lit)" stroke-width="4.5" stroke-linecap="round" />
            <path d="M41 57 34.7 13.1A44 44 0 0 1 70.2 23.9Z" fill="url(#wl-cone)" />
            <circle cx="41" cy="57" r="8" fill="#ffb46b" />
            <circle cx="41" cy="57" r="5" fill="#fff6e6" />
          </svg>
          <h1 class="wl-title">Mr <i>Sparkles</i></h1>
          <p class="wl-lead">Your city starts dark. Walk a street and it lights up, for good.</p>
        </div>

        <section class="wl-sum" aria-live="polite">
          <p class="wl-hero"><span id="wl-sum-dist">0</span><i id="wl-sum-unit">m</i></p>
          <p class="wl-sub" id="wl-sum-sub"></p>
          <div class="wl-rule" aria-hidden="true"></div>
          <p class="wl-label" id="wl-sum-label">New on your map</p>
          <p class="wl-names" id="wl-sum-names"></p>
          <p class="wl-more" id="wl-sum-more"></p>
        </section>

        <p class="wl-stats" id="wl-stats" hidden></p>
        <p class="wl-msg" id="wl-msg" role="alert" hidden></p>
        <button class="wl-go" id="wl-go" type="button">Start walking</button>
        <p class="wl-fine">
          <span class="wl-fine__privacy">Your location stays on this phone.</span>
          <span class="wl-fine__credit">
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>&nbsp;·
            <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a>&nbsp;·
            <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>
          </span>
        </p>
      </div>
    </main>

    <div class="wl-hud" id="wl-hud" hidden>
      <span class="wl-hud__dot" aria-hidden="true"></span>
      <span id="wl-hud-time">0:00</span>
      <span class="wl-hud__sep" aria-hidden="true"></span>
      <span id="wl-hud-dist">0 m</span>
      <span class="wl-hud__sep" aria-hidden="true"></span>
      <span id="wl-hud-steps">0 steps</span>
      <button class="wl-hud__end" id="wl-end" type="button">End</button>
    </div>
    <p class="wl-credit" id="wl-credit" hidden>
      <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ·
      <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">© OpenMapTiles</a> ·
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    </p>
    <div class="wl-toast" id="wl-toast" role="status" aria-live="polite" hidden></div>

    <script>
      // A tap on Start before the app has loaded still starts at once: ask for your location in
      // the same tap (browsers want a gesture for that), and leave the rest to the app. The iPhone
      // app asks through its native GPS instead, once the app is up.
      (function () {
        var B = window.__wl, go = document.getElementById('wl-go');
        var cap = window.Capacitor, native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
        if (B.sim) go.textContent = 'Start the demo walk';
        try {
          var s = JSON.parse(localStorage.getItem('wl-stats' + B.sfx) || 'null');
          if (s && s.streets > 0) {
            var el = document.getElementById('wl-stats');
            el.innerHTML = '<b>' + s.streets + '</b> street' + (s.streets === 1 ? '' : 's') + ' lit · <b>' + s.km + '</b> km walked';
            el.hidden = false;
          }
        } catch (e) {}
        go.addEventListener('click', function () {
          // Turn the phone to look around: on iPhone the compass needs permission, which a page
          // may only ask for in a tap, so it asks on every Start tap until it has it (the iPhone
          // app grants it without asking). It never holds up the GPS below. Its answer: B.orient.
          var DOE = window.DeviceOrientationEvent;
          if (B.orient !== 'granted' && DOE && typeof DOE.requestPermission === 'function') {
            try {
              DOE.requestPermission().then(
                function (s) {
                  B.orient = s === 'granted' ? 'granted' : 'denied';
                },
                function () {
                  B.orient = 'denied';
                }
              );
            } catch (e) {
              B.orient = 'denied';
            }
          }
          if (B.app || B.tapped) return;
          B.tapped = Date.now();
          go.setAttribute('aria-busy', 'true');
          if (B.sim || native || !navigator.geolocation || !window.isSecureContext) return;
          navigator.geolocation.getCurrentPosition(
            function (p) {
              var c = p.coords;
              B.fix = { lon: c.longitude, lat: c.latitude, acc: c.accuracy, t: p.timestamp || Date.now(), speed: c.speed, heading: c.heading };
            },
            function (e) {
              B.err = { code: e.code, message: e.message };
            },
            { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 },
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
